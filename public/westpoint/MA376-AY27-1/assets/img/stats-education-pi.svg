<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Your Statistics Education: MA491, MAx89, MA393, above a drawing of a Raspberry Pi.">
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="66" font-size="56" font-weight="bold" fill="#1f2937" text-anchor="middle">Your Statistics Education</text>
  <text x="500" y="124" font-size="36" font-weight="bold" fill="#c25708" text-anchor="middle">MA491/MAx89/MA393</text>

  <!-- Raspberry Pi -->
  <g transform="translate(-1816 -76) scale(3)">
    <rect x="668" y="82" width="200" height="104" rx="8" fill="#2e7d4f" stroke="#1f2937" stroke-width="2"/>
    <circle cx="679" cy="93" r="4" fill="#ffffff"/>
    <circle cx="679" cy="175" r="4" fill="#ffffff"/>
    <circle cx="825" cy="93" r="4" fill="#ffffff"/>
    <circle cx="825" cy="175" r="4" fill="#ffffff"/>
    <!-- GPIO header -->
    <rect x="692" y="86" width="124" height="15" fill="#1f2937"/>
    <g fill="#e8c35a">
      <rect x="696" y="89" width="4" height="9"/><rect x="705" y="89" width="4" height="9"/><rect x="714" y="89" width="4" height="9"/><rect x="723" y="89" width="4" height="9"/><rect x="732" y="89" width="4" height="9"/><rect x="741" y="89" width="4" height="9"/><rect x="750" y="89" width="4" height="9"/><rect x="759" y="89" width="4" height="9"/><rect x="768" y="89" width="4" height="9"/><rect x="777" y="89" width="4" height="9"/><rect x="786" y="89" width="4" height="9"/><rect x="795" y="89" width="4" height="9"/><rect x="804" y="89" width="4" height="9"/>
    </g>
    <!-- chips -->
    <rect x="712" y="114" width="42" height="42" rx="2" fill="#1f2937"/>
    <rect x="766" y="122" width="26" height="26" rx="2" fill="#3b4656"/>
    <!-- USB and ethernet -->
    <rect x="838" y="104" width="38" height="21" rx="1" fill="#c9ced6" stroke="#5a6472"/>
    <rect x="838" y="130" width="38" height="21" rx="1" fill="#c9ced6" stroke="#5a6472"/>
    <rect x="838" y="156" width="38" height="20" rx="1" fill="#e4e7eb" stroke="#5a6472"/>
    <!-- power and HDMI -->
    <rect x="690" y="176" width="18" height="14" rx="1" fill="#c9ced6" stroke="#5a6472"/>
    <rect x="726" y="176" width="24" height="14" rx="1" fill="#c9ced6" stroke="#5a6472"/>
  </g>
</svg>
